function bcDec(r,i){const[s,e0]=bcBest(r,i,103,106);if(s<0||e0>2)return null;const V=[s];let p=i+6,sum=e0;for(;;){if(p+7<=r.length&&V.length>=5&&bcM(r.slice(p,p+7),C128[106])<2.2){let c=V[0];for(let k=1;k<V.length-1;k++)c+=V[k]*k;if(c%103==V[V.length-1]&&sum/V.length<1.45){const t=bcChars(V);return t.length>=6?t:null}return null}if(p+6>r.length||V.length>64)return null;const[v,e]=bcBest(r,p,0,103);if(e>2.2)return null;V.push(v);sum+=e;p+=6}}
function bcRuns(g,win){const n=g.length,P=new Float64Array(n+1);for(let i=0;i<n;i++)P[i+1]=P[i]+g[i];const E=[];let ps=0,pd=0,on=false;for(let i=0;i<n;i++){const a=i<win?0:i-win,b=i+win>n?n:i+win,m=(P[b]-P[a])/(b-a),sv=g[i]-Math.min(m*0.9,m-8);if(i>0&&(ps<0)!==(sv<0)){const pos=i-1+ps/(ps-sv);if(!on){if(sv<0){on=true;E.push(pos)}}else E.push(pos)}ps=sv}const r=[];for(let k=1;k<E.length;k++)r.push(E[k]-E[k-1]);return r}
function bcRow(g){for(const d of [12,30,6]){const r=bcRuns(g,Math.max(16,Math.round(g.length/d)));for(let k=0;k+13<r.length;k+=2){const t=bcDec(r,k);if(t)return t}const q=r.slice().reverse();for(let k=0;k+13<q.length;k+=2){const t=bcDec(q,k);if(t)return t}const q2=q.slice(1);for(let k=0;k+13<q2.length;k+=2){const t=bcDec(q2,k);if(t)return t}}return null}
function bcFind(G,w,h,a,b,st){const row=new Float32Array(w);for(let y=a;y<b;y+=st){for(let x=0;x<w;x++){row[x]=(G[y*w+x]+G[Math.min(h-1,y+1)*w+x])/2}const t=bcRow(row);if(t)return t}return null}
function bcGray(im){const d=im.data,n=im.width*im.height,G=new Uint8Array(n);for(let i=0,j=0;i<n;i++,j+=4)G[i]=(d[j]*299+d[j+1]*587+d[j+2]*114)/1000;return G}
function bcScan(G,w,h,full){const st=Math.max(1,Math.floor(h/(full?100:60))),a=Math.floor(h*(full?.03:.2)),b=Math.floor(h*(full?.97:.8));let t=bcFind(G,w,h,a,b,st);if(t||!full)return t;const T=new Uint8Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++)T[x*h+y]=G[y*w+x];return bcFind(T,h,w,Math.floor(w*.03),Math.floor(w*.97),Math.max(1,Math.floor(w/100)))}
async function bcPhoto(f){const im=await createImageBitmap(f);for(const M of [1800,1400,1100,2400,700]){const k=Math.min(M>2000?2:1,M/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);const t=bcScan(bcGray(x.getImageData(0,0,w,h)),w,h,true);if(t)return t}return null}
